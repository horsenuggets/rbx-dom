[package]
name = "rbx_dom_weak"
description = "Weakly-typed Roblox DOM implementation for Rust"
version = "4.2.0"
license = "MIT"
documentation = "https://docs.rs/rbx_dom_weak"
homepage = "https://github.com/rojo-rbx/rbx-dom"
repository = "https://github.com/rojo-rbx/rbx-dom.git"
readme = "README.md"
authors = [
    "Lucien Greathouse <me@lpghatguy.com>",
    "Micah Reid <git@dekkonot.com>",
    "Ken Loeffler <kenloef@gmail.com>",
]
edition = "2018"

[dependencies]
# Canonical property identity relies on this reviewed typed serialization schema. Use the
# published release rather than the unreleased sibling crate, whose CFrame rotation
# encoding and dependency versions differ, so Git consumers keep one rbx_types identity
# with published rbx_binary and rbx_xml.
rbx_types = { version = "=3.1.0", features = ["serde"] }
ustr = { version = "1.1.0", features = ["serde"] }

ahash = "0.8.11"
rmp-serde = "=1.3.1"
serde = "1.0.137"

[dev-dependencies]
insta = { version = "1.14.1", features = ["yaml"] }
