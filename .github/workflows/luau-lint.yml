name: Luau Linting
on:
  push:
    branches: "main"
  pull_request:
    branches: "main"
    paths: ["**/*.lua", "**/*.luau", "aftman.toml", "styluau.toml", ".github/workflows/luau-lint.yml"]
jobs: 
  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ok-nick/setup-aftman@v0.4.2
      
      - name: Run Selene
        run: selene rbx_dom_lua/src
      
      - name: Run StyLuau
        run: styluau rbx_dom_lua/src --check